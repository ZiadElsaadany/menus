<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حمزة عبيد للحلاقة | الأسعار</title>
  <meta name="description" content="أسعار خدمات حمزة عبيد للحلاقة">
  <meta property="og:title" content="حمزة عبيد للحلاقة | الأسعار">
  <meta property="og:description" content="أسعار الشعر والدقن والباقات">
  <meta name="theme-color" content="#15233f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315233f'/%3E%3Cpath d='M-4 20 20-4h6L2 20zM8 32 32 8v6L14 32z' fill='%23c42a3c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<main class="menu">

  <header class="sign">
    <div class="pole" aria-hidden="true"></div>
    <h1>
      <span class="name">حمزة عبيد</span>
      <span class="trade">للحلاقة</span>
    </h1>
  </header>

  <!--
    ================== تعديل الأسعار ==================
    كل خدمة في سطر لوحدها:  <li><span>اسم الخدمة</span><b>السعر</b></li>
    غيّر الرقم اللي بين <b> و </b> بس، وسيب باقي السطر زي ما هو.
    عشان تضيف خدمة: انسخ سطر كامل وغيّر الاسم والسعر.
    عشان تشيل خدمة: امسح السطر كله.
    ====================================================
  -->

  <!-- العرض: السعر الجديد بين <b> والقديم بين <s> -->
  <section class="offer" aria-label="عرض">
    <span class="tag">عرض</span>
    <span class="item">تنظيف بشرة كامل</span>
    <span class="prices"><b>200</b><s>350</s></span>
  </section>

  <section class="list">
    <h2>الخدمات</h2>
    <ul>
      <li><span>شعر</span><b>80</b></li>
      <li><span>دقن</span><b>50</b></li>
      <li><span>حلاقة أطفال</span><b>70</b></li>
      <li><span>استشوار</span><b>50</b></li>
      <li><span>ويفي أو كيرلي</span><b>50</b></li>
      <li><span>فرد الشعر</span><b>30</b></li>
      <li><span>صبغة شعر</span><b>70</b></li>
    </ul>
  </section>

  <section class="list">
    <h2>الباقات</h2>
    <ul>
      <li><span>شعر ودقن ومسك</span><b>120</b></li>
      <li><span>شعر ودقن وفرد</span><b>120</b></li>
      <li><span>شعر ودقن وصبغة</span><b>150</b></li>
      <li><span>شعر ودقن واستشوار وحمام كريم ومسك</span><b>150</b></li>
    </ul>
  </section>

  <!-- ================ نهاية الأسعار ================ -->

  <p class="note">الأسعار بالجنيه المصري</p>

</main>
</body>
</html>
