<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كارت QR | حمزة عبيد للحلاقة</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=Aref+Ruqaa:wght@400;700&display=block" rel="stylesheet">
<style>
  @page { size: 105mm 148mm; margin: 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Alexandria", sans-serif; color: #15233f; background: #fff; }
  .card {
    width: 105mm; height: 148mm; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    background: #fff;
  }
  .pole {
    width: 100%; height: 5mm; flex: none;
    background: repeating-linear-gradient(45deg,
      #c42a3c 0 3mm, #fff 3mm 6mm, #24427a 6mm 9mm, #fff 9mm 12mm);
  }
  .sign {
    width: 100%; flex: none;
    background: #15233f; color: #fff; text-align: center;
    padding: 5mm 0 5.5mm;
    font-family: "Aref Ruqaa", serif; font-weight: 700; line-height: 1.1;
  }
  .sign .name { display: block; font-size: 17mm; }
  .sign .trade { display: block; font-size: 8mm; font-weight: 400; opacity: .85; margin-top: 1mm; }
  .qr { width: 66mm; height: 66mm; margin-top: 10mm; display: block; }
  .cta { margin: 6mm 0 0; font-size: 6mm; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="pole"></div>
    <div class="sign">
      <span class="name">حمزة عبيد</span>
      <span class="trade">للحلاقة</span>
    </div>
    <img class="qr" src="qr.svg" alt="QR لصفحة الأسعار">
    <p class="cta">امسح الكود لمعرفة الأسعار</p>
  </div>
</body>
</html>
